    bid-cooldown: "&f &cʏᴏᴜ ᴄᴜʀʀᴇɴᴛʟʏ ʜᴀᴠᴇ ᴀ {#ff7979}%cooldown% &cᴄᴏᴏʟᴅᴏᴡɴ ꜰᴏʀ ʙɪᴅᴅɪɴɢ ɪᴛᴇᴍꜱ!"
    offer-cooldown: "&f &cʏᴏᴜ ᴄᴜʀʀᴇɴᴛʟʏ ʜᴀᴠᴇ ᴀ {#ff7979}%cooldown% &cᴄᴏᴏʟᴅᴏᴡɴ ꜰᴏʀ ᴏꜰꜰᴇʀɪɴɢ ᴀ ʙɪᴅ!"
