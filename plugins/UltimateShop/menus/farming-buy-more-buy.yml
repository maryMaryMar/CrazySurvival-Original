title: '&f七七七七七七七七七七七七七'
size: 45

layout:
  - '000000000'
  - '000000000'
  - '0456B1230'
  - '000000000'
  - '0FFF0EEEA'

amount-items:
  1:
    display-item:
      material: PAPER
      custom-model-data: 100009
      name: '&#43c13a+1'
      lore:
        - '&7Click to add 1 more.'
    add-amount: 1
  2:
    display-item:
      material: PAPER
      custom-model-data: 100009
      name: '&#43c13a+10'
      lore:
        - '&7Click to add 10 more.'
    add-amount: 10
  3:
    display-item:
      material: PAPER
      custom-model-data: 100009
      name: '&#43c13a+32'
      lore:
        - '&7Click to add 32 more.'
    add-amount: 32
  4:
    display-item:
      material: PAPER
      custom-model-data: 100009
      name: '&#de4343-1'
      lore:
        - '&7Click to remove 1.'
    add-amount: -1
  5:
    display-item:
      material: PAPER
      custom-model-data: 100009
      name: '&#de4343-10'
      lore:
        - '&7Click to remove 10.'
    add-amount: -10
  6:
    display-item:
      material: PAPER
      custom-model-data: 100009
      name: '&#de4343-32'
      lore:
        - '&7Click to remove 32.'
    add-amount: -32
    # Support replace add-amount option to set-amount.
    # set-amount: 32

display-item: B

confirm-items:
  F:
    display-item:
      material: PAPER
      custom-model-data: 100009
      name: '&#cd886cConfirm x{amount}'
      lore:
        - '&7ᴄʟɪᴄᴋ ᴛᴏ ᴄᴏɴꜰɪʀᴍ ᴀɴᴅ ᴘᴜʀᴄʜᴀꜱᴇ'
        - '&7ᴛʜᴇ ǫᴜᴀɴᴛɪᴛʏ ʏᴏᴜ ʜᴀᴠᴇ ꜱᴇʟᴇᴄᴛᴇᴅ'
    # You can remove click-action option, then confirm button can do all things, like buy, sell, sell all.
    # If this option exists, then this confirm button can only do the thing.
    click-action: buy

buttons:
  A:
    display-item:
      material: PAPER
      custom-model-data: 100009
      name: '&#eabc89Back'
    actions:
      1:
        type: shop_menu
        shop: '{shop}'
  E:
    display-item:
      material: PAPER
      custom-model-data: 100009
      name: '&#cd886cCancel'
      lore:
        - '&7ᴄʟɪᴄᴋ ᴛᴏ ᴄᴀɴᴄᴇʟ ᴛʜᴇ ᴘᴜʀᴄʜᴀꜱᴇ'
        - '&7ᴛʜᴇ ǫᴜᴀɴᴛɪᴛʏ ʏᴏᴜ ʜᴀᴠᴇ ꜱᴇʟᴇᴄᴛᴇᴅ'
    actions:
      1:
        type: shop_menu
        shop: '{shop}'