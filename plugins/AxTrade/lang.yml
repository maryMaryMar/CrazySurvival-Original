  not-accepting: '&f &cᴛʜɪꜱ ᴘʟᴀʏᴇʀ ɪꜱ ɴᴏᴛ ᴀᴄᴄᴇᴘᴛɪɴɢ ᴛʀᴀᴅᴇꜱ!'
