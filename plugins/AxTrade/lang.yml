  cant-trade-self: '&f &cʏᴏᴜ ᴄᴀɴ''ᴛ ꜱᴇɴᴅ ᴀ ᴛʀᴀᴅᴇ ʀᴇǫᴜᴇꜱᴛ ᴛᴏ ʏᴏᴜʀꜱᴇʟꜰ!'
