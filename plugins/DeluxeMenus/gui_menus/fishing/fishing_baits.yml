      - "[message] &f &aꜱᴜᴄᴄᴇꜱꜱꜰᴜʟʟʏ ʙᴏᴜɢʜᴛ &#badc58ɢɪʟᴅᴇᴅ ꜱᴄᴀʟᴇ &aʙᴀɪᴛ"


  'whisperingleech':
    material: ECHO_SHARD
    amount: 1
    slot: 15
    item_flags:
      - HIDE_ATTRIBUTES
      - HIDE_ENCHANTS 
    update: true
    display_name: '&#1289A7&lᴡʜɪꜱᴘᴇʀɪɴɢ ʟᴇᴇᴄʜ'
    lore:
      - '&7&oᴛʜɪꜱ ʟᴇᴇᴄʜ ᴡʜɪꜱᴘᴇʀꜱ ᴡʜᴇɴ ʜᴇʟᴅ.'
      - '&7&oꜱᴏᴍᴇ ꜱᴀʏ ɪᴛ ꜰᴇᴇᴅꜱ ᴏɴ ᴛʜᴇ ᴇꜱꜱᴇɴᴄᴇ ᴏꜰ ᴛʜᴏᴜɢʜᴛ,'
      - '&7&oʟᴜʀɪɴɢ ᴏɴʟʏ ᴛʜᴇ ᴍᴏꜱᴛ ꜱᴇɴᴛɪᴇɴᴛ ᴄʀᴇᴀᴛᴜʀᴇꜱ.'
      - '&7'
      - '&#1289A7♦ &fᴀᴛᴛʀᴀᴄᴛꜱ &#1289A7ᴇᴘɪᴄ & ʟᴇɢᴇɴᴅᴀʀʏ ꜰɪꜱʜᴇꜱ'
      - '&#1289A7♦ &fᴘʀɪᴄᴇ: &2$&a580'
      - '&7'
      - '&f &eᴄʟɪᴄᴋ ᴛᴏ ᴘᴜʀᴄʜᴀꜱᴇ'
    click_requirement:
      requirements:
        money:
          type: javascript
          expression: '%vault_eco_balance% >= 580'
          deny_commands:
            - "[message] &f &cʏᴏᴜ ᴅᴏɴ'ᴛ ʜᴀᴠᴇ ᴇɴᴏᴜɢʜ ᴍᴏɴᴇʏ ᴛᴏ ᴘᴜʀᴄʜᴀꜱᴇ ᴛʜɪꜱ!"
            - "[close]"
    click_commands:
      - "[console] emf admin bait whisperingleech 1 %player_name%"
      - "[console] eco take %player_name% 580"
      - "[message] &f &aꜱᴜᴄᴄᴇꜱꜱꜰᴜʟʟʏ ʙᴏᴜɢʜᴛ &#badc58ᴡʜɪꜱᴘᴇʀɪɴɢ ʟᴇᴇᴄʜ &aʙᴀɪᴛ"