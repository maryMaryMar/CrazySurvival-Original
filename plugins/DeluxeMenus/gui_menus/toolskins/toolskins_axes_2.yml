#ToolSkins


  'toolskins_toggle_1':
    material: NETHERITE_AXE
    model_data: 5
    amount: 1
    slot: 11
    priority: 1
    item_flags:
      - HIDE_ATTRIBUTES
      - HIDE_ENCHANTS 
    update: true
    display_name: '&b&lʙʟᴀᴢᴇ ꜱᴋɪɴ'
    lore:
      - '&7ʜᴏʟᴅ ᴀ ɴᴇᴛʜᴇʀɪᴛᴇ ᴀxᴇ ɪɴ'
      - '&7ʏᴏᴜʀ ʜᴀɴᴅ ᴛᴏ ᴀᴘᴘʟʏ ᴛʜᴇ ꜱᴋɪɴ'
      - ''
      - '&8▪ &fᴀᴘᴘʟɪᴇᴅ ᴏɴ: &eɴᴇᴛʜᴇʀɪᴛᴇ ᴀxᴇ'
      - '&8▪ &fᴘʀɪᴄᴇ: &2$&a73,200'
      - ''
      - '&f &eᴄʟɪᴄᴋ ᴛᴏ ᴀᴘᴘʟʏ'
    click_requirement:
      requirements:
        check:
          type: string equals ignorecase
          input: "%player_item_in_hand%"
          output: "NETHERITE_AXE"
          deny_commands:
            - "[message] &f &cʏᴏᴜ ᴀʀᴇ ɴᴏᴛ ʜᴏʟᴅɪɴɢ ᴀɴ ɴᴇᴛʜᴇʀɪᴛᴇ ᴀxᴇ!"  
    view_requirement:
      requirements:
        permission:
          type: "has permission"
          permission: rskin.change.axe.blaze
    click_commands:
      - "[player] rskin apply axe_blaze"
      - "[close]"
