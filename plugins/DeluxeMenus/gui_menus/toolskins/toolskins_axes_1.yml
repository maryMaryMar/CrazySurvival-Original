      - '&7ʜᴏʟᴅ ᴀ ɴᴇᴛʜᴇʀɪᴛᴇ ᴀxᴇ ɪɴ'
      - '&7ʏᴏᴜʀ ʜᴀɴᴅ ᴛᴏ ᴀᴘᴘʟʏ ᴛʜᴇ ꜱᴋɪɴ'
      - ''
      - '&8▪ &fᴀᴘᴘʟɪᴇᴅ ᴏɴ: &eɴᴇᴛʜᴇʀɪᴛᴇ ᴀxᴇ'
      - '&8▪ &fᴘʀɪᴄᴇ: &6800&f'
      - ''
      - '&f &eᴄʟɪᴄᴋ ᴛᴏ ᴀᴘᴘʟʏ'
    click_requirement:
      requirements:
        check:
          type: string equals ignorecase
          input: "%player_item_in_hand%"
          output: "NETHERITE_AXE"
          deny_commands:
            - "[message] &f &cʏᴏᴜ ᴀʀᴇ ɴᴏᴛ ʜᴏʟᴅɪɴɢ ᴀɴ ɴᴇᴛʜᴇʀɪᴛᴇ ᴀxᴇ!"  
    view_requirement:
      requirements:
        permission:
          type: "has permission"
          permission: rskin.change.axe.floral
    click_commands:
      - "[player] rskin apply axe_floral"
      - "[close]"
  'toolskins_purchase_1':
