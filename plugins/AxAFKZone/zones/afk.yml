  left: '&f &#648DC1ʏᴏᴜ ʜᴀᴠᴇ ʟᴇꜰᴛ ᴛʜᴇ ᴀꜰᴋ ᴢᴏɴᴇ, ꜱᴛᴀʏᴇᴅ ꜰᴏʀ: &#5BB8ED%time%!'
