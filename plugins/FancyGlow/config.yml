  Enable_Rainbow: <white> <green>ꜱᴜᴄᴄᴇꜱꜱꜰᴜʟʟʏ ᴛᴏɢɢʟᴇᴅ ɢʟᴏᴡ
  Disable_Rainbow: <white> <#648DC1>ʏᴏᴜʀ ɢʟᴏᴡ ʜᴀꜱ ʙᴇᴇɴ ʀᴇᴍᴏᴠᴇᴅ.
