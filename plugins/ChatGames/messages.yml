##    CHATGAME MESSAGES    ##
#############################

#YOU CAN USE "%display_name%" AS A REPLACEMENT FOR %player% IN correct_message FOR ALL GAMES.
unscramble:
    gameStartAnnouncement: 
      - ''
      - '&f &d★ ᴜɴsᴄʀᴀᴍʙʟᴇ ɢᴀᴍᴇ'
      - '       &7ʏᴏᴜ ʜᴀᴠᴇ %timeToGuess% sᴇᴄᴏɴᴅs ᴛᴏ ᴜɴsᴄʀᴀᴍʙʟᴇ: #f8adf8%word%'
      - ''
    correct_message: 
      - ''
      - '&f &c♦ ɢᴀᴍᴇ ᴇɴᴅᴇᴅ'
      - '       #fc8b8b%player% &7ᴜɴsᴄʀᴀᴍʙʟᴇᴅ #fc8b8b%correct_answer%'
      - '       &7ɪɴ #fc8b8b%time%s &7ᴀɴᴅ ɢᴏᴛ ᴀ ᴘʀɪᴢᴇ!'
    time_expired_message:
      - ''
      - '&f &c♦ ɢᴀᴍᴇ ᴇɴᴅᴇᴅ'
      - '       &7%timeToGuess%s ʜᴀᴠᴇ ᴘᴀssᴇᴅ! ᴛʜᴇ ᴜɴsᴄʀᴀᴍʙʟᴇ ɢᴀᴍᴇ ɪs ɴᴏᴡ ᴏᴠᴇʀ!'
