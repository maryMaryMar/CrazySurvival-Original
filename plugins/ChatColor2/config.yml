version: 1.16.1
stats: true
storage:
  # Set this to "sql" if you want to use SQL.
  type: yaml
  # These settings do nothing if you're not using SQL.
  database:
    # Valid values: mysql, mariadb
    type: mysql
    address: localhost
    port: 3306
    name: chatcolor_db
    user: database_user
    password: database_password
settings:
  event-priority: LOWEST
  auto-save: true
  save-interval: 10
  color-override: false
  notify-others: false
  join-message: false
  confirm-timeout: 15
  default-color: '&7'
  command-name: chatcolor
  force-group-colors: true
  default-color-enabled: true
  command-opens-gui: false
  ignore-symbol-prefixes: true
  remove-inaccessible-colors: false
placeholders:
- '[item]'
default:
  code: 1
  color: '&7'

